plugins {
  id 'java-library'
  id 'maven-publish'
}

group = 'org.zalava.modules'
version = '0.1.0-alpha.3'

java {
  toolchain { languageVersion = JavaLanguageVersion.of(25) }
  withSourcesJar()
  withJavadocJar()
}

def moduleApiVersion = providers.gradleProperty('moduleApiVersion').orElse('0.1.0-alpha.3')

dependencies {
  compileOnly "org.zalava:module-api:${moduleApiVersion.get()}"
  implementation 'org.telegram:telegrambots-longpolling:7.10.0'
  implementation 'org.telegram:telegrambots-client:7.10.0'
  testImplementation "org.zalava:module-api:${moduleApiVersion.get()}"
  testImplementation "org.zalava:module-api-test:${moduleApiVersion.get()}"
  testImplementation 'org.junit.jupiter:junit-jupiter:6.0.1'
  testImplementation 'org.assertj:assertj-core:4.0.0-M1'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.0.1'
}

tasks.withType(JavaCompile).configureEach { options.release = 25 }
tasks.named('test') {
  useJUnitPlatform()
  dependsOn tasks.named('jar')
  systemProperty 'module.artifact', tasks.named('jar').flatMap { it.archiveFile }.get().asFile.absolutePath
  systemProperty 'module.version', project.version
}
tasks.named('jar') {
  archiveBaseName = 'zalava-module-channel-telegram'
  from('module-metadata.yaml')
}
tasks.named('processResources') {
  filesMatching('module.properties') { expand(moduleVersion: project.version) }
}
tasks.register('verifyReleaseArtifact') {
  dependsOn tasks.named('jar')
  doLast {
    def contents = zipTree(tasks.named('jar').get().archiveFile.get().asFile)
    if (contents.matching { include 'module-metadata.yaml' }.isEmpty()) throw new GradleException('module JAR must embed module-metadata.yaml')
    if (!contents.matching { include 'org/zalava/channels/**' }.isEmpty()) throw new GradleException('module JAR must not bundle module-api classes')
  }
}
tasks.named('check') { dependsOn tasks.named('verifyReleaseArtifact') }

publishing {
  publications {
    module(MavenPublication) {
      from components.java
      artifactId = 'zalava-module-channel-telegram'
    }
  }
}
