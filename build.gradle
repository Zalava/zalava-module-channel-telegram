buildscript {
  repositories { mavenCentral() }
  dependencies { classpath 'org.yaml:snakeyaml:2.5' }
}

plugins {
    id 'jacoco'
    id 'com.diffplug.spotless' version '7.2.1'
  id 'java-library'
  id 'maven-publish'
}

group = 'org.zalava.modules'
def metadata = new org.yaml.snakeyaml.Yaml().load(file('module-metadata.yaml').getText('UTF-8'))
version = metadata.modules[0].version
if (metadata.modules[0].artifact.version != version) throw new GradleException('Metadata artifact version must match module version')
def releaseTag = System.getenv('CI_COMMIT_TAG')
if (releaseTag && releaseTag != "v${version}") throw new GradleException('Release tag must match module metadata version')

java {
  toolchain { languageVersion = JavaLanguageVersion.of(25) }
  withSourcesJar()
  withJavadocJar()
}

def moduleApiVersion = providers.gradleProperty('moduleApiVersion').orElse('0.1.0-alpha.7')

dependencies {
  compileOnly "org.zalava:module-api:${moduleApiVersion.get()}"
  implementation 'org.telegram:telegrambots-longpolling:7.10.0'
  implementation 'org.telegram:telegrambots-client:7.10.0'
  testImplementation "org.zalava:module-api:${moduleApiVersion.get()}"
  testImplementation "org.zalava:module-api-test:${moduleApiVersion.get()}"
  testImplementation 'org.junit.jupiter:junit-jupiter:6.0.1'
  testImplementation 'org.assertj:assertj-core:4.0.0-M1'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.0.1'
}

tasks.withType(JavaCompile).configureEach { options.release = 25 }
tasks.named('test') {
    classpath = files(sourceSets.test.output, configurations.testRuntimeClasspath)
  useJUnitPlatform()
  dependsOn tasks.named('jar')
  systemProperty 'module.artifact', tasks.named('jar').flatMap { it.archiveFile }.get().asFile.absolutePath
  systemProperty 'module.version', project.version
}
tasks.named('jar') {
  archiveBaseName = 'zalava-module-channel-telegram'
  from('module-metadata.yaml')
}
tasks.named('processResources') {
  filesMatching('module.properties') { expand(moduleVersion: project.version) }
}
tasks.register('verifyReleaseArtifact') {
  dependsOn tasks.named('jar')
  doLast {
    def contents = zipTree(tasks.named('jar').get().archiveFile.get().asFile)
    if (contents.matching { include 'module-metadata.yaml' }.isEmpty()) throw new GradleException('module JAR must embed module-metadata.yaml')
    if (!contents.matching { include 'org/zalava/api/**' }.isEmpty()) throw new GradleException('module JAR must not bundle module-api classes')
  }
}
tasks.named('check') { dependsOn tasks.named('verifyReleaseArtifact') }

publishing {
  publications {
    module(MavenPublication) {
      from components.java
      artifactId = 'zalava-module-channel-telegram'
    }
  }
}


// Keep module quality gates aligned with the Zalava host.
spotless {
    java {
        target 'src/**/*.java'
        googleJavaFormat('1.36.1')
    }
}

jacoco {
    toolVersion = '0.8.14'
}

tasks.named('test') {
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
        csv.required = true
    }
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn tasks.named('test')
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.90
            }
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.74
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('spotlessCheck')
    dependsOn tasks.named('jacocoTestCoverageVerification')
}


// Unit tests exercise adapter failure paths separately from built-JAR acceptance.
sourceSets {
    unitTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    unitTestImplementation.extendsFrom testImplementation
    unitTestRuntimeOnly.extendsFrom testRuntimeOnly
}
dependencies {
    unitTestImplementation 'org.mockito:mockito-core:5.20.0'
}
tasks.register('unitTest', Test) {
    group = 'verification'
    description = 'Deterministic unit tests; built-JAR contract acceptance remains in test.'
    testClassesDirs = sourceSets.unitTest.output.classesDirs
    classpath = sourceSets.unitTest.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter tasks.named('test')
}
tasks.named('jacocoTestReport') {
    dependsOn tasks.named('unitTest')
    executionData.setFrom(layout.buildDirectory.file('jacoco/test.exec'), layout.buildDirectory.file('jacoco/unitTest.exec'))
}
tasks.named('jacocoTestCoverageVerification') {
    dependsOn tasks.named('unitTest')
    executionData.setFrom(layout.buildDirectory.file('jacoco/test.exec'), layout.buildDirectory.file('jacoco/unitTest.exec'))
}
tasks.named('check') {
    dependsOn tasks.named('unitTest')
}
