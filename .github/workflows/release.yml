name: Release Telegram module
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require release commit on public main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew check
        env:
          CI_COMMIT_TAG: ${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: verified-module
          path: build/libs/zalava-module-channel-telegram-*.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: build/reports/
  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-module
          path: artifacts
      - run: sha256sum artifacts/*.jar > artifacts/zalava-module-channel-telegram.sha256
      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            artifacts/*.jar
            artifacts/zalava-module-channel-telegram.sha256
