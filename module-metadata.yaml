schemaVersion: 1
modules:
  - moduleId: zalava-module-channel-telegram
    version: 0.1.0-alpha.7
    displayName: Telegram channel
    description: Telegram long-polling channel adapter for Zalava semantic channel events.
    supportUrl: https://github.com/Zalava/zalava-module-channel-telegram
    artifact:
      groupId: org.zalava.modules
      artifactId: zalava-module-channel-telegram
      version: 0.1.0-alpha.7
    source:
      repository: https://github.com/Zalava/zalava-module-channel-telegram.git
      license: Apache-2.0
    build:
      command: ["./gradlew", "check"]
      verificationCommand: ["./gradlew", "test"]
    compatibility:
      zalavaRuntime: ">=1.0.0 <2.0.0"
    configurationSchema:
      type: object
      additionalProperties: false
      properties:
        botTokenRef:
          type: string
          x-secret-reference: true
          description: Host-managed secret reference for the Telegram bot token.
    factories: []
    services:
      provided: []
      required: []
    operations: []
    security:
      permissions: []
